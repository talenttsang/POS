name: Deploy to Cloud Run

# Needs the GCP_SA_KEY repository secret (a service-account JSON key with the
# roles listed in README.md). Until it is set, deploy from a Claude session or
# a workstation with deploy.sh.

on:
  push:
    branches: [main]
    paths:
      - 'src/cloud_run/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: bash deploy.sh
